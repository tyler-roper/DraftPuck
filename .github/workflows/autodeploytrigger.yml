name: Build and update ACR

on:
  push:
    branches:
      - main
    paths:
      - "DraftPuck.**/**"
      - ".github/workflows/autodeploytrigger.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Web App image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-web:${{ github.sha }}
          file: DraftPuck.Web/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}

      - name: Build and push Worker Function image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-worker:${{ github.sha }}
          file: DraftPuck.Worker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}

      - name: Build and push Discord Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-discord-bot:${{ github.sha }}
          file: DraftPuck.DiscordBot/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}

      - name: Git SHA
        run: echo "Git SHA for this build: ${{ steps.set_sha.outputs.git_sha }}"
