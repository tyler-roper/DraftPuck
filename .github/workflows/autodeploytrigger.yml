name: Trigger auto deployment for DraftPuck

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
      - "DraftPuck.**/**"
      - ".github/workflows/autodeploytrigger.yml"

  # Allow mannually trigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to container registry
        uses: docker/login-action@v1
        with:
          registry: brewpuck.azurecr.io
          username: ${{ secrets.BREWPUCK_REGISTRY_USERNAME }}
          password: ${{ secrets.BREWPUCK_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: brewpuck.azurecr.io/brewpuck:${{ github.sha }}
          file: DraftPuck.Web/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.BREWPUCK_AZURE_CREDENTIALS }}

      - name: Deploy to containerapp
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp registry set -n brewpuck -g BrewPuck --server brewpuck.azurecr.io --username  ${{ secrets.BREWPUCK_REGISTRY_USERNAME }} --password ${{ secrets.BREWPUCK_REGISTRY_PASSWORD }}
            az containerapp update -n brewpuck -g BrewPuck --image brewpuck.azurecr.io/brewpuck:${{ github.sha }} \
              --replace-env-vars \
                DRAFTPUCK_ConnectionStrings__DefaultConnection=secretref:sql-connection-string \
                DRAFTPUCK_APPLICATION__BASEPATH=https://draftpuck.com \
                DRAFTPUCK_FIREBASE__Type=service_account \
                DRAFTPUCK_FIREBASE__ProjectId=draftpuck \
                DRAFTPUCK_FIREBASE__PrivateKeyId=1a6bf9228a250af94913f0bf36bf0a9b9450a518 \
                DRAFTPUCK_FIREBASE__PrivateKey=-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----  \
                DRAFTPUCK_FIREBASE__ClientEmail=firebase-adminsdk-fbsvc@draftpuck.iam.gserviceaccount.com \
                DRAFTPUCK_FIREBASE__ClientId=109573622353752189978 \
                DRAFTPUCK_FIREBASE__AuthUri=https://accounts.google.com/o/oauth2/auth \
                DRAFTPUCK_FIREBASE__TokenUri=https://oauth2.googleapis.com/token \
                DRAFTPUCK_FIREBASE__AuthProviderX509CertUrl=https://www.googleapis.com/oauth2/v1/certs \
                DRAFTPUCK_FIREBASE__ClientX509CertUrl=https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-fbsvc%40draftpuck.iam.gserviceaccount.com \
                DRAFTPUCK_FIREBASE__UniverseDomain=googleapis.com

