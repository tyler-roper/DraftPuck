name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "DraftPuck.**/**"
      - ".github/workflows/autodeploytrigger.yml"
  workflow_dispatch:

# Tests and the three image builds run side by side, and the deploy needs all of them: a failing test still blocks the
# release, without making the builds wait for it. (Images from a failing commit are pushed under its SHA but never
# deployed.)
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web
            image: draftpuck-web
            dockerfile: DraftPuck.Web/Dockerfile
          - app: worker
            image: draftpuck-worker
            dockerfile: DraftPuck.Worker/Dockerfile
          - app: discord
            image: draftpuck-discord-bot
            dockerfile: DraftPuck.DiscordBot/Dockerfile
    name: Build ${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Each image keeps its own layer cache (restore and npm install are reused until their inputs change).
      - name: Build and push the ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          file: ${{ matrix.dockerfile }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, build]
    strategy:
      # One app failing to roll out shouldn't cancel the others mid-update.
      fail-fast: false
      matrix:
        include:
          - app: web
            image: draftpuck-web
            name_secret: CONTAINER_APP_WEB_NAME
          - app: worker
            image: draftpuck-worker
            name_secret: CONTAINER_APP_WORKER_NAME
          - app: discord
            image: draftpuck-discord-bot
            name_secret: CONTAINER_APP_DISCORD_BOT_NAME
    name: Deploy ${{ matrix.app }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Plain Azure CLI rather than azure/container-apps-deploy-action, whose last release (2023) still runs on a
      # retired Node version. Images are pulled with the apps' managed identity, so no registry credentials here.
      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy the ${{ matrix.app }} app
        run: >-
          az containerapp update --only-show-errors -o none
          -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets[matrix.name_secret] }}"
          --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}"
          && echo "Deployed ${{ matrix.image }}:${{ github.sha }}"
