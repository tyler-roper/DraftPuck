name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "DraftPuck.**/**"
      - ".github/workflows/autodeploytrigger.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Web App image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-web:${{ github.sha }}
          file: DraftPuck.Web/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build and push Worker Function image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-worker:${{ github.sha }}
          file: DraftPuck.Worker/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build and push Discord Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-discord-bot:${{ github.sha }}
          file: DraftPuck.DiscordBot/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Git SHA
        run: "echo 'Git SHA for this build: ${{ github.sha }}'"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Web App to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.CONTAINER_APP_WEB_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-web:${{ github.sha }}

      - name: Deploy Worker to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-worker:${{ github.sha }}

      - name: Deploy Discord Bot to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.CONTAINER_APP_DISCORD_BOT_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-discord-bot:${{ github.sha }}