name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "DraftPuck.**/**"
      - ".github/workflows/autodeploytrigger.yml"
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Web App image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-web:${{ github.sha }}
          file: DraftPuck.Web/Dockerfile
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build and push Worker Function image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-worker:${{ github.sha }}
          file: DraftPuck.Worker/Dockerfile
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build and push Discord Bot
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-discord-bot:${{ github.sha }}
          file: DraftPuck.DiscordBot/Dockerfile
          cache-from: type=gha,scope=discord
          cache-to: type=gha,mode=max,scope=discord
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Git SHA
        run: "echo 'Git SHA for this build: ${{ github.sha }}'"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Plain Azure CLI rather than azure/container-apps-deploy-action, whose last release (2023) still runs on a
      # retired Node version. Images are pulled with the apps' managed identity, so no registry credentials here.
      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy Web App to Container Apps
        run: >-
          az containerapp update --only-show-errors -o none
          -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets.CONTAINER_APP_WEB_NAME }}"
          --image "${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-web:${{ github.sha }}"

      - name: Deploy Worker to Container Apps
        run: >-
          az containerapp update --only-show-errors -o none
          -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets.CONTAINER_APP_WORKER_NAME }}"
          --image "${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-worker:${{ github.sha }}"

      - name: Deploy Discord Bot to Container Apps
        run: >-
          az containerapp update --only-show-errors -o none
          -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets.CONTAINER_APP_DISCORD_BOT_NAME }}"
          --image "${{ secrets.ACR_LOGIN_SERVER }}/draftpuck-discord-bot:${{ github.sha }}"
