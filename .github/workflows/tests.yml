name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Integration tests start SQL Server and Redis containers with Testcontainers (Docker is preinstalled on the runner).
      - name: Run tests
        run: dotnet test DraftPuck.Tests/DraftPuck.Tests.csproj --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: TestResults

  client:
    name: Client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: DraftPuck.Web/ClientApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DraftPuck.Web/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test
