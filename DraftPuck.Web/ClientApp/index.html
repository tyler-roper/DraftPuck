<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, interactive-widget=resizes-content">

  <!-- Primary Meta Tags -->
  <title>DRAFTPUCK - A live hockey drinking game.</title>
  <meta name="title" content="DRAFTPUCK - A live hockey drinking game.">
  <meta name="description" content="Invite your friends, pick players, and give out drinks based on real-time events during live NHL games!">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://draftpuck.com/">
  <meta property="og:title" content="DRAFTPUCK - A live hockey drinking game.">
  <meta property="og:description" content="Invite your friends, pick players, and give out drinks based on real-time events during live NHL games!">
  <meta property="og:image" content="/meta-img.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://draftpuck.com/">
  <meta property="twitter:title" content="DRAFTPUCK - A live hockey drinking game.">
  <meta property="twitter:description" content="Invite your friends, pick players, and give out drinks based on real-time events during live NHL games!">
  <meta property="twitter:image" content="/meta-img.png">

  <link rel="icon" href="/favicon.ico">

  <link rel="manifest" href="/manifest.json">
  <!-- iPhone home screen: iOS ignores the manifest's icons (it drew a "D" on a yellow tile). No
       apple-mobile-web-app-status-bar-style on purpose: the default is the one that avoids iOS 27's top-edge blur of
       installed web apps (black-translucent triggers it), and the setting is frozen when the app is added. -->

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DRAFTPUCK">
  <meta name="theme-color" content="#1c1917">
</head>

<body>
  <noscript>
    <strong>We're sorry but DRAFTPUCK doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>

  <div id="app" class="h-100"></div>
  <!-- Its own file, not inline, so the Content-Security-Policy can forbid inline scripts. -->
  <script src="/app-height.js"></script>
  <script src="/env.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
